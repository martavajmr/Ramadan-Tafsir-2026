<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffffff"><meta name="description" content="Ramadan Tafsir audio library"><title>Ramadan Tafsir 2026</title>
<style>
:root{--green:#16794b;--green2:#e9f5ee;--ink:#17221c;--muted:#718078;--line:#e8eee9;--bg:#f7faf8;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input{font:inherit}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:126px}.top{background:#fff;padding:20px 17px 15px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:11px}.mark{width:42px;height:42px;border-radius:14px;background:var(--green2);display:grid;place-items:center;color:var(--green);font-size:23px}.brand h1{font-size:19px;margin:0;font-weight:750;letter-spacing:-.4px}.brand p{font-size:12px;color:var(--muted);margin:3px 0 0}.search{margin-top:16px;position:relative}.search input{width:100%;border:1px solid var(--line);border-radius:13px;padding:13px 14px 13px 42px;background:#f9fbfa;outline:none}.search span{position:absolute;left:14px;top:11px;color:#819087;font-size:19px}.tabs{display:flex;gap:8px;overflow:auto;padding:13px 16px 4px;scrollbar-width:none}.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;color:#506057;font-size:13px}.tabs button.active{background:var(--green);border-color:var(--green);color:white}.sectionhead{padding:14px 17px 8px;display:flex;justify-content:space-between;align-items:center}.sectionhead h2{font-size:15px;margin:0}.sectionhead small{color:var(--muted)}.list{padding:0 12px}.item{display:flex;align-items:center;gap:11px;padding:11px 9px;background:#fff;border:1px solid var(--line);border-radius:15px;margin:7px 0}.logo{width:43px;height:43px;border-radius:12px;object-fit:cover;background:var(--green2);flex-shrink:0}.fallback{display:grid;place-items:center;color:var(--green);font-weight:750;font-size:13px}.info{min-width:0;flex:1}.name{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:var(--muted);margin-top:4px}.actions{display:flex;align-items:center;gap:5px}.iconbtn{border:0;background:transparent;color:#7b8981;font-size:19px;padding:7px;min-width:34px}.iconbtn.fav{color:#d28a25}.play{width:37px;height:37px;border:0;border-radius:50%;background:var(--green);color:#fff;font-size:15px}.empty{text-align:center;color:var(--muted);padding:48px 20px;font-size:14px}.player{position:fixed;bottom:0;left:0;right:0;z-index:8;background:#fff;border-top:1px solid var(--line);box-shadow:0 -5px 25px #173b2410;padding:10px max(14px,calc((100vw - 730px)/2)) calc(10px + env(safe-area-inset-bottom))}.now{display:flex;align-items:center;gap:10px}.now .logo{width:39px;height:39px}.nowinfo{flex:1;min-width:0}.nowtitle{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nowmeta{font-size:10px;color:var(--muted);margin-top:3px}.controls{display:flex;align-items:center;gap:8px}.controls button{border:0;background:transparent;color:var(--green);font-size:20px;padding:5px}.progressrow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:10px;color:var(--muted)}input[type=range]{flex:1;accent-color:var(--green);height:3px}.hide{display:none!important}@media(min-width:650px){.top{border-radius:0 0 18px 18px}.list{padding:0 17px}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="mark">☪</div><div><h1>Ramadan Tafsir 2026</h1><p>Audio library</p></div></div><div class="search"><span>⌕</span><input id="search" placeholder="Search Sheikh or Tafsir…" autocomplete="off"></div></header><nav class="tabs" id="tabs"><button class="active" data-filter="All">Duka</button><button data-filter="Tafsir Safe">Tafsir Safe</button><button data-filter="Tafsir Yamma">Tafsir Yamma</button><button data-filter="Tafsir Dare">Tafsir Dare</button><button data-filter="Muhadara">Muhadara</button><button data-filter="Favourites">Favourites</button><button data-filter="Recent">Recently played</button></nav><div class="sectionhead"><h2 id="heading">All recordings</h2><small id="count"></small></div><main class="list" id="list"><div class="empty">Loading audio library…</div></main></div>
<div class="player" id="player"><div class="now"><img class="logo" id="nowlogo" src="logo/default.png" onerror="this.style.display='none'"><div class="nowinfo"><div class="nowtitle" id="nowtitle">Choose a recording</div><div class="nowmeta" id="nowmeta">Ramadan Tafsir 2026</div></div><div class="controls"><button id="back" aria-label="Back 10 seconds">↶</button><button id="toggle" aria-label="Play or pause">▶</button><button id="forward" aria-label="Forward 10 seconds">↷</button></div></div><div class="progressrow"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="duration">0:00</span></div></div>
<audio id="audio" preload="metadata"></audio>
<script>
const $=id=>document.getElementById(id);let audios=[],filter='All',current=null;const audio=$('audio');let favs=new Set(JSON.parse(localStorage.getItem('rt_favs')||'[]'));let recent=JSON.parse(localStorage.getItem('rt_recent')||'[]');
const labels={'All':'All recordings','Tafsir Safe':'Tafsir Safe','Tafsir Yamma':'Tafsir Yamma','Tafsir Dare':'Tafsir Dare','Muhadara':'Muhadara','Favourites':'Favourites','Recent':'Recently played'};
function fmt(s){if(!Number.isFinite(s))return '0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
function logoHTML(a){return `<img class="logo" src="${a.logo}" onerror="this.onerror=null;this.outerHTML='<div class=\'logo fallback\'>${(a.sheikhKey||'').slice(0,2).toUpperCase()}</div>'" alt="">`}
function visible(){let q=$('search').value.trim().toLowerCase();return audios.filter(a=>{let f=filter==='All'||a.session===filter||(filter==='Favourites'&&favs.has(a.id))||(filter==='Recent'&&recent.includes(a.id));return f&&(!q||(a.sheikh+' '+a.session+' '+a.file).toLowerCase().includes(q))})}
function render(){let rows=visible();$('heading').textContent=labels[filter]||filter;$('count').textContent=rows.length+' recordings';$('list').innerHTML=rows.length?rows.map(a=>`<article class="item">${logoHTML(a)}<div class="info"><div class="name">${esc(a.sheikh)}</div><div class="meta">${esc(a.session)}${a.day?' · Ramadan '+a.day:''} · ${a.format}</div></div><div class="actions"><button class="iconbtn ${favs.has(a.id)?'fav':''}" data-fav="${esc(a.id)}" aria-label="Favourite">${favs.has(a.id)?'♥':'♡'}</button><button class="play" data-play="${esc(a.id)}" aria-label="Play">${current&&current.id===a.id&&!audio.paused?'Ⅱ':'▶'}</button></div></article>`).join(''):'<div class="empty">No recordings found.</div>'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function play(a){if(current&&current.id===a.id){audio.paused?audio.play():audio.pause();return}current=a;audio.src=a.url;audio.play().catch(()=>{});$('nowtitle').textContent=a.sheikh;$('nowmeta').textContent=a.session+(a.day?' · Ramadan '+a.day:'');$('nowlogo').style.display='';$('nowlogo').src=a.logo;recent=[a.id,...recent.filter(x=>x!==a.id)].slice(0,30);localStorage.setItem('rt_recent',JSON.stringify(recent));if('mediaSession'in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:a.session+(a.day?' · Ramadan '+a.day:''),artist:a.sheikh,album:'Ramadan Tafsir 2026'});navigator.mediaSession.setActionHandler('play',()=>audio.play());navigator.mediaSession.setActionHandler('pause',()=>audio.pause());navigator.mediaSession.setActionHandler('seekbackward',()=>audio.currentTime=Math.max(0,audio.currentTime-10));navigator.mediaSession.setActionHandler('seekforward',()=>audio.currentTime=Math.min(audio.duration||Infinity,audio.currentTime+10))}render()}
$('list').addEventListener('click',e=>{let p=e.target.closest('[data-play]'),f=e.target.closest('[data-fav]');if(p){let a=audios.find(x=>x.id===p.dataset.play);if(a)play(a)}if(f){let id=f.dataset.fav;favs.has(id)?favs.delete(id):favs.add(id);localStorage.setItem('rt_favs',JSON.stringify([...favs]));render()}});
$('tabs').addEventListener('click',e=>{let b=e.target.closest('button[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));render()});$('search').addEventListener('input',render);
$('toggle').onclick=()=>audio.paused?audio.play():audio.pause();$('back').onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-10);$('forward').onclick=()=>audio.currentTime=Math.min(audio.duration||Infinity,audio.currentTime+10);$('seek').oninput=()=>{if(audio.duration)audio.currentTime=audio.duration*Number($('seek').value)/1000};audio.addEventListener('timeupdate',()=>{$('elapsed').textContent=fmt(audio.currentTime);$('duration').textContent=fmt(audio.duration);if(audio.duration)$('seek').value=audio.currentTime/audio.duration*1000});audio.addEventListener('play',()=>{$('toggle').textContent='Ⅱ';render()});audio.addEventListener('pause',()=>{$('toggle').textContent='▶';render()});audio.addEventListener('ended',()=>{$('toggle').textContent='▶';render()});
fetch('audios.json').then(r=>{if(!r.ok)throw Error('Could not load audios.json');return r.json()}).then(data=>{audios=data;render()}).catch(()=>{$('list').innerHTML='<div class="empty">Could not load the audio catalogue. Please check that audios.json is uploaded beside index.html.</div>'});
</script></body></html>
