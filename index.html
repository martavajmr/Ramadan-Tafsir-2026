<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#fff"><title>Ramadan Tafseer 2026</title>
<style>
:root{--g:#16794b;--pale:#eaf5ee;--ink:#26332c;--muted:#78847d;--line:#e8eee9;--bg:#f5f7f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:130px}.top{background:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px}.mark{width:42px;height:42px;border-radius:14px;background:var(--pale);display:grid;place-items:center;color:var(--g);font-size:22px}.brand h1{font-size:19px;margin:0;font-weight:750}.brand p{font-size:12px;color:var(--muted);margin:3px 0 0}.search{margin-top:14px;position:relative}.search input{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px 14px 12px 40px;background:#fafcfb;outline:none}.search span{position:absolute;left:13px;top:8px;font-size:20px;color:var(--muted)}.sectionhead{padding:16px 16px 8px;display:flex;align-items:center;justify-content:space-between}.sectionhead h2{font-size:16px;margin:0}.sectionhead small{font-size:12px;color:var(--muted)}.list{padding:0 12px}.sheikh{display:flex;align-items:center;gap:14px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:14px;margin:8px 0;box-shadow:0 2px 5px #15291b0b;cursor:pointer}.photo{width:68px;height:68px;object-fit:cover;border-radius:13px;background:var(--pale);flex-shrink:0}.fallback{display:grid;place-items:center;color:var(--g);font-weight:800;font-size:18px}.sheikhname{font-size:15px;font-weight:650;line-height:1.3}.sheikhmeta{font-size:12px;color:var(--muted);margin-top:5px}.arrow{margin-left:auto;color:#99a59d;font-size:23px}.back{border:0;background:var(--pale);color:var(--g);padding:9px 13px;border-radius:10px;font-weight:650;margin:14px 16px 4px}.folderhero{margin:8px 14px 12px;background:white;border:1px solid var(--line);border-radius:15px;padding:15px;display:flex;align-items:center;gap:13px}.folderhero .photo{width:62px;height:62px}.folderhero h2{font-size:16px;margin:0}.folderhero p{font-size:12px;color:var(--muted);margin:5px 0 0}.year{margin:10px 14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}.year.disabled{cursor:default;opacity:.82}.year.opened{border-color:#dcebe1}.year strong{font-size:15px}.year small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.soon{font-size:11px;color:#9a741e;background:#fff5d9;padding:6px 9px;border-radius:99px}.filters{display:flex;gap:7px;overflow:auto;padding:8px 14px 6px;scrollbar-width:none}.filters button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-size:12px;color:#56645b}.filters button.active{background:var(--g);border-color:var(--g);color:white}.record{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px;margin:7px 0}.record .photo{width:44px;height:44px;border-radius:11px}.info{flex:1;min-width:0}.name{font-size:13px;font-weight:650}.meta{font-size:11px;color:var(--muted);margin-top:4px}.actions{display:flex;align-items:center;gap:4px}.iconbtn{border:0;background:transparent;color:#7d8a81;font-size:19px;padding:7px}.fav{color:#d28a25}.play{width:36px;height:36px;border:0;border-radius:50%;background:var(--g);color:white}.empty{text-align:center;color:var(--muted);padding:36px 18px;font-size:13px}.hidden{display:none!important}.player{position:fixed;bottom:0;left:0;right:0;z-index:8;background:#fff;border-top:1px solid var(--line);box-shadow:0 -5px 22px #173b2410;padding:9px max(14px,calc((100vw - 730px)/2)) calc(9px + env(safe-area-inset-bottom))}.now{display:flex;align-items:center;gap:9px}.now .photo{width:38px;height:38px}.nowinfo{flex:1;min-width:0}.nowtitle{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nowmeta{font-size:10px;color:var(--muted);margin-top:3px}.controls{display:flex;gap:7px}.controls button{border:0;background:transparent;color:var(--g);font-size:20px;padding:5px}.progress{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:10px;color:var(--muted)}input[type=range]{flex:1;accent-color:var(--g);height:3px}@media(min-width:650px){.list{padding:0 17px}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="mark">☪</div><div><h1>Ramadan Tafseer</h1><p>2026 Audio Library</p></div></div><div class="search"><span>⌕</span><input id="search" placeholder="Search Sheikh or recording…" autocomplete="off"></div></header>
<section id="home"><div class="sectionhead"><h2>Sheikhs</h2><small id="sheikhcount"></small></div><main class="list" id="sheikhs"><div class="empty">Loading Sheikhs…</div></main></section>
<section id="detail" class="hidden"><button class="back" id="back">← All Sheikhs</button><div class="folderhero"><img id="heroLogo" class="photo" alt=""><div><h2 id="heroName"></h2><p id="heroCount"></p></div></div><div class="year disabled"><div><strong>Ramadan Tafseer 2027</strong><small>Sabbin karatuttuka nan ba da jimawa ba</small></div><span class="soon">Coming Soon</span></div><button class="year opened" id="open2026" type="button" style="width:calc(100% - 28px);text-align:left"><div><strong>Ramadan Tafseer 2026</strong><small>Available recordings</small></div><span style="color:var(--g);font-size:12px;font-weight:700">Open ›</span></button><div id="yearContent" class="hidden"><div class="sectionhead"><h2>Recordings</h2><small id="count"></small></div><nav class="filters" id="filters"><button class="active" data-filter="All">Duka</button><button data-filter="Tafsir Safe">Tafsir Safe</button><button data-filter="Tafsir Yamma">Tafsir Yamma</button><button data-filter="Tafsir Dare">Tafsir Dare</button><button data-filter="Muhadara">Muhadara</button></nav><main class="list" id="records"></main></div></section></div>
<div class="player"><div class="now"><img class="photo" id="nowlogo" alt=""><div class="nowinfo"><div class="nowtitle" id="nowtitle">Choose a recording</div><div class="nowmeta" id="nowmeta">Ramadan Tafseer 2026</div></div><div class="controls"><button id="back10">↶</button><button id="toggle">▶</button><button id="forward10">↷</button></div></div><div class="progress"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="duration">0:00</span></div></div><audio id="audio" preload="metadata"></audio>
<script>
const $=id=>document.getElementById(id);let audios=[],folders=[],selected=null,filter='All',current=null;const audio=$('audio');let favs=new Set(JSON.parse(localStorage.getItem('rt_favs')||'[]'));let recent=JSON.parse(localStorage.getItem('rt_recent')||'[]');
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(s){return Number.isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00'}
function photo(src,name,cls='photo'){let initials=(name||'').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();return `<img class="${cls}" src="${esc(src||'')}" onerror="this.outerHTML='<div class=\'${cls} fallback\'>${esc(initials||'SH')}</div>'" alt="">`}
function showHome(){selected=null;$('home').classList.remove('hidden');$('detail').classList.add('hidden');$('search').placeholder='Search Sheikh…';$('search').value='';renderFolders()}
function openFolder(name,addHistory=true){selected=folders.find(f=>f.name===name);if(!selected)return;if(addHistory)history.pushState({screen:'detail',sheikh:selected.name},'', '#sheikh='+encodeURIComponent(selected.name));filter='All';$('yearContent').classList.add('hidden');$('open2026').classList.remove('hidden');$('home').classList.add('hidden');$('detail').classList.remove('hidden');$('search').value='';$('search').placeholder='Search this Sheikh’s recordings…';$('heroName').textContent=selected.name;$('heroCount').textContent=selected.items.length+' recordings';$('heroLogo').src=selected.logo||'';$('heroLogo').onerror=()=>{$('heroLogo').style.display='none'};$('heroLogo').style.display='';document.querySelectorAll('#filters button').forEach(b=>b.classList.toggle('active',b.dataset.filter==='All'));renderRecords()}
function openYear(addHistory=true){if(!selected)return;if(addHistory)history.pushState({screen:'year',sheikh:selected.name},'', '#year='+encodeURIComponent(selected.name));$('yearContent').classList.remove('hidden');$('open2026').classList.add('hidden')}
function restoreScreen(state){if(!state||state.screen==='home'){showHome();return}if(state.screen==='detail'||state.screen==='year'){openFolder(state.sheikh,false);if(state.screen==='year')openYear(false);return}showHome()}
function renderFolders(){let q=$('search').value.toLowerCase().trim();let rows=folders.filter(f=>f.name.toLowerCase().includes(q));$('sheikhcount').textContent=rows.length+' Sheikhs';$('sheikhs').innerHTML=rows.length?rows.map(f=>`<article class="sheikh" data-folder="${esc(f.name)}">${photo(f.logo,f.name)}<div><div class="sheikhname">${esc(f.name)}</div><div class="sheikhmeta">${f.items.length} recordings · 2026 Tafseer</div></div><span class="arrow">›</span></article>`).join(''):'<div class="empty">No Sheikh found.</div>'}
function renderRecords(){let q=$('search').value.toLowerCase().trim();let rows=selected.items.filter(a=>(filter==='All'||a.session===filter)&&(!q||(a.sheikh+' '+a.session+' '+a.file).toLowerCase().includes(q))).sort((a,b)=>(a.day||999)-(b.day||999)||a.file.localeCompare(b.file));$('count').textContent=(filter==='All'?'Duka · ':'')+rows.length+' recordings';$('records').innerHTML=rows.length?rows.map(a=>`<article class="record">${photo(a.logo,a.sheikh)}<div class="info"><div class="name">${esc(a.session==='Muhadara'?'Muhadara':('Tafseer Day '+(a.day||'' )+(a.session==='Tafsir'?'':(' '+a.session))))}</div><div class="meta">${esc(a.session)}${a.day?' · Ramadan '+a.day:''} · ${esc(a.format)}</div></div><div class="actions"><button class="iconbtn ${favs.has(a.id)?'fav':''}" data-fav="${esc(a.id)}">${favs.has(a.id)?'♥':'♡'}</button><button class="play" data-play="${esc(a.id)}">${current&&current.id===a.id&&!audio.paused?'Ⅱ':'▶'}</button></div></article>`).join(''):'<div class="empty">No recordings in this category.</div>'}
function play(a){if(current&&current.id===a.id){audio.paused?audio.play():audio.pause();return}current=a;audio.src=a.url;audio.play().catch(()=>{});$('nowtitle').textContent=a.sheikh;$('nowmeta').textContent=a.session+(a.day?' · Ramadan '+a.day:'');$('nowlogo').src=a.logo||'';recent=[a.id,...recent.filter(x=>x!==a.id)].slice(0,30);localStorage.setItem('rt_recent',JSON.stringify(recent));if('mediaSession'in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:a.session+(a.day?' · Ramadan '+a.day:''),artist:a.sheikh,album:'Ramadan Tafseer 2026'});navigator.mediaSession.setActionHandler('play',()=>audio.play());navigator.mediaSession.setActionHandler('pause',()=>audio.pause())}renderRecords()}
$('sheikhs').addEventListener('click',e=>{let c=e.target.closest('[data-folder]');if(c)openFolder(c.dataset.folder)});$('back').onclick=()=>history.back();$('open2026').onclick=()=>openYear();$('filters').addEventListener('click',e=>{let b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('active',x===b));renderRecords()});$('records').addEventListener('click',e=>{let p=e.target.closest('[data-play]'),f=e.target.closest('[data-fav]');if(p){let a=selected.items.find(x=>x.id===p.dataset.play);if(a)play(a)}if(f){let id=f.dataset.fav;favs.has(id)?favs.delete(id):favs.add(id);localStorage.setItem('rt_favs',JSON.stringify([...favs]));renderRecords()}});$('search').addEventListener('input',()=>selected?renderRecords():renderFolders());$('toggle').onclick=()=>audio.paused?audio.play():audio.pause();$('back10').onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-10);$('forward10').onclick=()=>audio.currentTime=Math.min(audio.duration||Infinity,audio.currentTime+10);$('seek').oninput=()=>{if(audio.duration)audio.currentTime=audio.duration*Number($('seek').value)/1000};audio.addEventListener('timeupdate',()=>{$('elapsed').textContent=fmt(audio.currentTime);$('duration').textContent=fmt(audio.duration);if(audio.duration)$('seek').value=audio.currentTime/audio.duration*1000});audio.addEventListener('play',()=>{$('toggle').textContent='Ⅱ';if(selected)renderRecords()});audio.addEventListener('pause',()=>{$('toggle').textContent='▶';if(selected)renderRecords()});
// Keep the browser/Android Back button in sync with the app's screens.
history.replaceState({screen:'home'},'',location.pathname+location.search);
window.addEventListener('popstate',e=>restoreScreen(e.state));
fetch('audios.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{audios=data;let map=new Map();for(let a of audios){let n=a.sheikh;let f=map.get(n);if(!f){f={name:n,logo:a.logo,items:[]};map.set(n,f)}f.items.push(a)}folders=[...map.values()].sort((a,b)=>a.name.localeCompare(b.name));renderFolders()}).catch(()=>$('sheikhs').innerHTML='<div class="empty">Could not load audios.json. Upload it beside index.html.</div>');
</script></body></html>
